summary = "WindowsToolsAccess"
description = "Les outils d'entretien de Windows dans une seule fenêtre à six onglets : outils rapides, nettoyage, programmes lancés avec Windows, services, fenêtres de Windows et outils avancés (DISM, SFC, Defender et plus). NVDA+Ctrl+Maj+W ouvre la fenêtre. Basé sur AbsoluteWindows de Chai Chaimee et Peera Pilarit."
