summary = "BeMyAssistantAccess"
description = """مساعد ذكاء اصطناعي لـ NVDA: يصف الشاشة أو أي كائن، ويقرأ المستندات والصور، ويترجم، ويحوّل الصوت إلى نص، ويكتب ما تمليه عليه، ويدردش معك، ويمكنه أن ينقر ويكتب نيابةً عنك. يعمل مع خدمات عبر الإنترنت أو مع ذكاء اصطناعي يعمل بالكامل على حاسوبك. مبني على Vision Assistant Pro من تأليف Mahmood Hozhabri."""
changelog = """الإصدار الأول من BeMyAssistantAccess، مبني على Vision Assistant Pro."""
