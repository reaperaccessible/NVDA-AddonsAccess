summary = "BeMyAssistantAccess"
description = """یک دستیار هوش مصنوعی برای NVDA: صفحه یا یک شیء را توصیف می‌کند، سندها و تصویرها را می‌خواند، ترجمه می‌کند، صدا را به نوشته تبدیل می‌کند، آنچه را می‌گویید تایپ می‌کند، گفتگو می‌کند و می‌تواند به‌جای شما کلیک کند و تایپ کند. با سرویس‌های آنلاین یا با هوش مصنوعی‌ای کار می‌کند که کاملاً روی رایانه شما اجرا می‌شود. بر پایه Vision Assistant Pro اثر Mahmood Hozhabri."""
changelog = """نخستین نسخه BeMyAssistantAccess، بر پایه Vision Assistant Pro."""
