summary = "BeMyAssistantAccess"
description = """Un assistant IA pour NVDA : il décrit l'écran ou un objet, lit les documents et les images, traduit, transcrit, prend la dictée, converse, et peut cliquer et taper pour vous. Il fonctionne avec des services en ligne ou avec une IA qui tourne entièrement sur votre ordinateur. Basé sur Vision Assistant Pro de Mahmood Hozhabri."""
changelog = """Quelques textes étaient encore en anglais : ils sont maintenant traduits. Aussi : quand l'IA locale ne peut pas démarrer, l'extension dit pourquoi, et quoi faire."""
