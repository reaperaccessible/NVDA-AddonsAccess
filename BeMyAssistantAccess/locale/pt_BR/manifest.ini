summary = "BeMyAssistantAccess"
description = """Um assistente de IA para o NVDA: descreve a tela ou um objeto, lê documentos e imagens, traduz, transcreve, escreve o que você dita, conversa com você e pode clicar e digitar por você. Funciona com serviços on-line ou com uma IA que roda inteiramente no seu computador. Baseado no Vision Assistant Pro, de Mahmood Hozhabri."""
