summary = "BeMyAssistantAccess"
description = """Ein KI-Assistent für NVDA: Er beschreibt den Bildschirm oder ein Objekt, liest Dokumente und Bilder vor, übersetzt, transkribiert, nimmt Diktate auf, unterhält sich mit Ihnen und kann für Sie klicken und tippen. Er arbeitet mit Online-Diensten oder mit einer KI, die vollständig auf Ihrem Computer läuft. Basiert auf Vision Assistant Pro von Mahmood Hozhabri."""
changelog = """Erste Version von BeMyAssistantAccess, basierend auf Vision Assistant Pro."""
