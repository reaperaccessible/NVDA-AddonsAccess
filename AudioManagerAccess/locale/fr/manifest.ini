summary = "AudioManagerAccess"
description = "Le son de Windows dans une seule fenêtre : sorties et entrées (volume, coupure, appareil par défaut), chaque application avec son propre volume et sa propre sortie et entrée, la sortie de NVDA et un verrou pour le volume du micro. NVDA+Ctrl+Maj+P ouvre la fenêtre du son. Basé sur Audio Manager de huaiyinfeilong."
changelog = "Deux nouveaux outils dans la fenêtre du son et en commandes : Redémarrer le son de Windows, quand le son est perdu ou bloqué, et Ouvrir le panneau Son de Windows (la fenêtre Son classique)."
