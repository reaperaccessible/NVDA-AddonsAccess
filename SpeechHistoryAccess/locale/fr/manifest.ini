summary = "SpeechHistoryAccess : consultation et copie de l'historique de la parole"
description = "Cette extension permet de relire les derniers textes annoncés par NVDA, par défaut avec NVDA+Maj+F10 et NVDA+Maj+F11.  Vous pouvez aussi copier n'importe quel élément annoncé dans le presse-papiers avec NVDA+Maj+F12.  Tous les réglages se trouvent dans la catégorie SpeechHistoryAccess des Paramètres de NVDA : le nombre maximal d'entrées conservées, ce qui se passe après une copie, et la suppression des espaces au début ou à la fin du texte.  Utilisez le dialogue Gestes de commandes de NVDA pour modifier les raccourcis fournis."
