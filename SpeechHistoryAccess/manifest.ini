name = "SpeechHistoryAccess"
summary = "SpeechHistoryAccess: speech history review and copying"
description = "This add-on allows you to review the most recent strings spoken by NVDA, by default using NVDA+Shift+F10 and NVDA+Shift+F11.  Additionally, you can copy any spoken item to the clipboard by pressing NVDA+Shift+F12.  All settings are in the SpeechHistoryAccess category of NVDA's Settings dialog: the maximum number of stored history entries, what happens after copying, and whether whitespace should be trimmed from the start or end of text.  Use NVDA's Input Gestures dialog to change the supplied keystrokes."
version = "2026.1"
url = "https://github.com/jscholes/nvda-speech-history"
author = "ReaperAccessible"
lastTestedNVDAVersion = "2026.1"
minimumNVDAVersion = 2020.4.0
