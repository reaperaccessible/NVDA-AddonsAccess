summary = "LocalTranslateAccess"
description = "Traduit ce que NVDA annonce, sur votre propre ordinateur, pour une application ou pour toutes. Le français et l'anglais sont inclus ; les autres langues se téléchargent à la demande."
changelog = "La traduction en continu détecte maintenant toujours la langue de ce que NVDA annonce. Une langue réglée pour une application, ou déclarée par une page, ne masque plus un texte écrit dans une autre langue."
