summary = "LocalTranslateAccess"
description = "Traduit ce que NVDA annonce, sur votre propre ordinateur, pour une application ou pour toutes. Le français et l'anglais sont inclus ; les autres langues se téléchargent à la demande."
changelog = "Plus simple pour tout le monde : la traduction s'active sans fenêtre de préparation, les réglages tiennent sur une page (la langue vers laquelle traduire, les langues installées), et les réglages détaillés passent dans Options avancées. Les fenêtres ouvertes depuis le menu sont de nouveau annoncées."
