summary = "LocalTranslateAccess"
description = "Traduit ce que NVDA annonce, sur votre propre ordinateur, pour une application ou pour toutes. Le français et l'anglais sont inclus ; les autres langues s'ajoutent sous forme de packs de langues."
changelog = "Des langues plus simples : une langue manquante se résume à une question claire suivie d'un téléchargement direct, et les langues s'ajoutent depuis une liste à cocher. Il n'est plus question de moteurs ni de modèles."
