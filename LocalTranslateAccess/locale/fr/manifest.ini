summary = "LocalTranslateAccess"
description = "Traduit ce que NVDA annonce, sur votre propre ordinateur, pour une application ou pour toutes. Le français et l'anglais sont inclus ; les autres langues se téléchargent à la demande."
changelog = "NVDA+Maj+T traduit directement la sélection. Historique des traductions, jusqu'à dix langues favorites choisies avec les chiffres 1 à 0, arrêt d'une traduction longue, et deux nouveaux réglages : copier automatiquement chaque traduction et remplacer les tirets bas par des espaces."
