summary = "SpeakWriteAccess : corrigez votre texte et dictez avec une IA sur votre ordinateur"
description = "Corrige le texte sélectionné d'un seul raccourci, NVDA+Ctrl+Maj+O, et écrit ce que vous dites au micro là où se trouve le curseur, NVDA+Ctrl+Maj+L, et écrit ce qui est dit dans un fichier audio ou vidéo, NVDA+Ctrl+Maj+F. Tout est fait par une IA qui tourne sur votre propre ordinateur : rien n'est envoyé sur Internet. L'IA s'installe à part avec le ReaperAccessible Installer Manager. Les réglages sont dans la catégorie SpeakWriteAccess des Paramètres de NVDA."
changelog = "Nouveau : NVDA+Ctrl+Maj+F transcrit un fichier audio ou vidéo, celui sélectionné dans l'Explorateur de fichiers ou un fichier que vous choisissez. Le texte s'écrit dans une fenêtre, phrase par phrase, et peut être copié ou enregistré. Nouveau réglage : le micro de la dictée, choisi parmi les entrées de vos cartes de son. Nécessite NVDA 2026.3 ou plus récent."
