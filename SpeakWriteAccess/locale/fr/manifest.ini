summary = "SpeakWriteAccess : corrigez votre texte et dictez avec une IA sur votre ordinateur"
description = "Corrige le texte sélectionné d'un seul raccourci, NVDA+Ctrl+Maj+O, et écrit ce que vous dites au micro là où se trouve le curseur, NVDA+Ctrl+Maj+L. Tout est fait par une IA qui tourne sur votre propre ordinateur : rien n'est envoyé sur Internet. L'IA s'installe à part avec le ReaperAccessible Installer Manager. Les réglages sont dans la catégorie SpeakWriteAccess des Paramètres de NVDA."
changelog = "La correction de la sélection passe sur NVDA+Ctrl+Maj+O : NVDA+Ctrl+Maj+C sert à l'Accès à distance de NVDA pour envoyer le presse-papiers. Nécessite NVDA 2026.3 ou plus récent."
