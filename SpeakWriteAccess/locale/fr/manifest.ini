summary = "SpeakWriteAccess : corrigez votre texte et dictez avec une IA sur votre ordinateur"
description = "Corrige le texte sélectionné d'un seul raccourci, NVDA+Ctrl+Maj+O, et écrit ce que vous dites au micro là où se trouve le curseur, NVDA+Ctrl+Maj+L, et écrit ce qui est dit dans un fichier audio ou vidéo, NVDA+Ctrl+Maj+F. Il peut aussi ajouter des émojis au texte sélectionné. NVDA+Ctrl+Maj+E dit ce qu'il est en train de faire. Tout est fait par une IA qui tourne sur votre propre ordinateur : rien n'est envoyé sur Internet. L'IA s'installe à part avec le ReaperAccessible Installer Manager. Les réglages sont dans la catégorie SpeakWriteAccess des Paramètres de NVDA."
changelog = "Nouveau : la dictée peut s'écrire dans une autre langue que la vôtre, traduite par l'IA, avec le réglage Écrire ce que vous dites en. La page des réglages est plus courte : les réglages rarement utiles sont maintenant derrière le bouton Options avancées. Une seule copie de l'IA tourne à la fois, ce qui la garde rapide. Nécessite NVDA 2026.3 ou plus récent."
