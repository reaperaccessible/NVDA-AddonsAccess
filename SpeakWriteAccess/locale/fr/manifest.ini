summary = "SpeakWriteAccess : corrigez votre texte et dictez avec une IA sur votre ordinateur"
description = "Corrige le texte que vous sélectionnez, écrit ce que vous dites au micro et transcrit vos fichiers audio et vidéo, avec une IA qui tourne sur votre propre ordinateur : rien n'est envoyé sur Internet. NVDA+Ctrl+Maj+O corrige la sélection. NVDA+Ctrl+Maj+L démarre ou arrête la dictée, écrite là où se trouve le curseur, phrase par phrase ou tout d'un coup à la fin, avec le micro de votre choix, et même traduite dans une autre langue. NVDA+Ctrl+Maj+F transcrit un fichier audio ou vidéo. Il peut aussi ajouter des émojis au texte sélectionné. NVDA+Ctrl+Maj+E dit ce qu'il est en train de faire, et NVDA+Ctrl+L ouvre ses réglages. L'IA s'installe à part avec le ReaperAccessible Installer Manager."
changelog = "La description de l'extension dit maintenant tout ce qu'elle fait. Nécessite NVDA 2026.3 ou plus récent."
