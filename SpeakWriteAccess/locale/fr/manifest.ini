summary = "SpeakWriteAccess : corrigez votre texte et dictez avec une IA sur votre ordinateur"
description = "Corrige le texte sélectionné d'un seul raccourci, NVDA+Ctrl+Maj+O, et écrit ce que vous dites au micro là où se trouve le curseur, NVDA+Ctrl+Maj+L, et écrit ce qui est dit dans un fichier audio ou vidéo, NVDA+Ctrl+Maj+F. NVDA+Ctrl+Maj+E dit ce qu'il est en train de faire. Tout est fait par une IA qui tourne sur votre propre ordinateur : rien n'est envoyé sur Internet. L'IA s'installe à part avec le ReaperAccessible Installer Manager. Les réglages sont dans la catégorie SpeakWriteAccess des Paramètres de NVDA."
changelog = "Nouveau : NVDA+Ctrl+Maj+E dit ce que fait SpeakWriteAccess : la dictée, une correction ou une transcription, et si l'IA est prête. Nécessite NVDA 2026.3 ou plus récent."
