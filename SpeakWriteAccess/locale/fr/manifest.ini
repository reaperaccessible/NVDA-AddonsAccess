summary = "SpeakWriteAccess : corrigez votre texte et dictez avec une IA sur votre ordinateur"
description = "Corrige le texte sélectionné d'un seul raccourci, NVDA+Ctrl+Maj+C, et écrit ce que vous dites au micro là où se trouve le curseur, NVDA+Ctrl+Maj+D. Tout est fait par une IA qui tourne sur votre propre ordinateur : rien n'est envoyé sur Internet. L'IA s'installe à part avec le ReaperAccessible Installer Manager. Les réglages sont dans la catégorie SpeakWriteAccess des Paramètres de NVDA."
changelog = "Première version."
