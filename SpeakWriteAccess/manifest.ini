name = "SpeakWriteAccess"
summary = "SpeakWriteAccess: correct your text and dictate with an AI on your computer"
description = "Corrects the selected text with one shortcut, NVDA+Ctrl+Shift+O, and writes what you say into the microphone where the cursor is, NVDA+Ctrl+Shift+L, and writes down what is said in an audio or video file, NVDA+Ctrl+Shift+F. It can also add emojis to the selected text. NVDA+Ctrl+Shift+E says what it is doing. Everything is done by an AI that runs on your own computer: nothing is sent over the Internet. The AI is installed separately with the ReaperAccessible Installer Manager. Settings are in the SpeakWriteAccess category of NVDA's Settings dialog."
version = "2026.8"
changelog = "New: the dictation can be written in another language than yours, translated by the AI, with the setting Write what you say in. The settings page is shorter: the rarely used settings are now behind the Advanced options button. Only one copy of the AI runs at a time, which keeps it fast. Requires NVDA 2026.3 or later."
url = "https://github.com/reaperaccessible/NVDA-AddonsAccess"
sourceURL = "https://github.com/reaperaccessible/NVDA-AddonsAccess"
