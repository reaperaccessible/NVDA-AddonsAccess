name = "SpeakWriteAccess"
summary = "SpeakWriteAccess: correct your text and dictate with an AI on your computer"
description = "Corrects the selected text with one shortcut, NVDA+Ctrl+Shift+C, and writes what you say into the microphone where the cursor is, NVDA+Ctrl+Shift+D. Everything is done by an AI that runs on your own computer: nothing is sent over the Internet. The AI is installed separately with the ReaperAccessible Installer Manager. Settings are in the SpeakWriteAccess category of NVDA's Settings dialog."
