name = "SpeakWriteAccess"
summary = "SpeakWriteAccess: correct your text and dictate with an AI on your computer"
description = "Corrects the text you select, writes what you say into the microphone and transcribes your audio and video files, with an AI that runs on your own computer: nothing is sent over the Internet. NVDA+Ctrl+Shift+O corrects the selection. NVDA+Ctrl+Shift+L starts or stops the dictation, written where the cursor is, phrase by phrase or all at once at the end, with the microphone of your choice, and even translated into another language. NVDA+Ctrl+Shift+F transcribes an audio or video file. It can also add emojis to the selected text. NVDA+Ctrl+Shift+E says what it is doing, and NVDA+Ctrl+L opens its settings. The AI is installed separately with the ReaperAccessible Installer Manager."
version = "2026.9"
changelog = "The description of the add-on now tells all it does. Requires NVDA 2026.3 or later."
