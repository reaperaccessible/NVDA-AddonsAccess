name = "SpeakWriteAccess"
summary = "SpeakWriteAccess: correct your text and dictate with an AI on your computer"
description = "Corrects the selected text with one shortcut, NVDA+Ctrl+Shift+O, and writes what you say into the microphone where the cursor is, NVDA+Ctrl+Shift+L, and writes down what is said in an audio or video file, NVDA+Ctrl+Shift+F. Everything is done by an AI that runs on your own computer: nothing is sent over the Internet. The AI is installed separately with the ReaperAccessible Installer Manager. Settings are in the SpeakWriteAccess category of NVDA's Settings dialog."
version = "2026.4"
changelog = "New: NVDA+Ctrl+Shift+F transcribes an audio or video file, the one selected in File Explorer or one you choose. The text is written in a window, phrase by phrase, and can be copied or saved. New setting: the microphone of the dictation, chosen among the inputs of your sound cards. Requires NVDA 2026.3 or later."
url = "https://github.com/reaperaccessible/NVDA-AddonsAccess"
sourceURL = "https://github.com/reaperaccessible/NVDA-AddonsAccess"
