summary = """BookmarksAccess"""
description = """Dấu trang của bạn từ Chrome, Edge, Brave và Firefox, gom vào một danh sách duy nhất để bạn sắp xếp theo thư mục. NVDA+Ctrl+Shift+U, trong trình duyệt web, sao chép địa chỉ của trang đang mở và thêm vào danh sách của bạn: bạn chỉ cần chọn thư mục. Các trình duyệt không bao giờ bị thay đổi."""
