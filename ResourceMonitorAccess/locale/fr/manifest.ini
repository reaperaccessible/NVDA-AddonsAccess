summary = "ResourceMonitorAccess"
description = "Annonce l'état de l'ordinateur : charge du processeur, applications les plus gourmandes, mémoire, disques, connexion réseau, test de vitesse Internet, Wi-Fi, batterie, version de Windows, temps depuis le démarrage de Windows et carte graphique NVIDIA. Signale les connexions et déconnexions Wi-Fi. Basé sur Resource Monitor d'Alex Hall, Joseph Lee, Kefas Lungu et d'autres contributeurs de NVDA."
changelog = "Le test de vitesse Internet indique combien de temps attendre quand le service refuse des tests trop fréquents, au lieu d'annoncer 0, et consomme deux fois moins de données."
