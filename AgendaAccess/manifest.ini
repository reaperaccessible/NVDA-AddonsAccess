name = AgendaAccess
summary = "AgendaAccess"
description = "An agenda made for NVDA: the appointments of each day, repetitions of every kind, reminders spoken by NVDA with ringtones and also sent to the phone if wanted, a search, a journal, and an agenda shared between computers with Dropbox or OneDrive. NVDA+Ctrl+Shift+Enter opens the agenda. Inspired by Agenda by Abel Passos, Ângelo Abrantes and Rui Fontes, and by Mon agenda by Louis-Rock Lampron."
author = "ReaperAccessible"
url = https://github.com/reaperaccessible/NVDA-AddonsAccess
sourceURL = https://github.com/reaperaccessible/NVDA-AddonsAccess
license = "GPL v2"
licenseURL = https://www.gnu.org/licenses/gpl-2.0.html
version = 2026.7
changelog = "One day of a series can be changed alone, or from a day on. Other details: more categories, importance, status, availability, private, organizer, meeting link, time zone. Several agendas, someone else's agenda read only, online agendas, a public copy of yours. Import and export of .ics files (Outlook, Google, iPhone). Also: location, end time, all day, several days, reminders at any delay or time of day, Remind me again."
