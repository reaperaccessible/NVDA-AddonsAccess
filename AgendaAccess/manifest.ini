name = AgendaAccess
summary = "AgendaAccess"
description = "An agenda made for NVDA: the appointments of each day, repetitions of every kind, reminders spoken by NVDA, a search, a journal, and an agenda shared between computers with Dropbox or OneDrive. NVDA+Ctrl+Shift+Enter opens the agenda. Inspired by Agenda by Abel Passos, Ângelo Abrantes and Rui Fontes, and by Mon agenda by Louis-Rock Lampron."
