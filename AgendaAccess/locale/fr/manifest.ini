summary = "AgendaAccess"
description = "Un agenda fait pour NVDA : les rendez-vous de chaque jour, des répétitions de toutes sortes, des rappels annoncés par NVDA avec des sonneries et envoyés aussi au téléphone si vous le voulez, une recherche, un journal, et un agenda partagé entre ordinateurs avec Dropbox ou OneDrive. NVDA+Ctrl+Maj+Entrée ouvre l'agenda. Inspiré d'Agenda d'Abel Passos, Ângelo Abrantes et Rui Fontes, et de Mon agenda de Louis-Rock Lampron."
changelog = "Un jour d'une série peut être modifié seul, ou à partir d'un jour. Autres détails : plus de catégories, importance, statut, disponibilité, privé, organisateur, lien de réunion, fuseau horaire. Plusieurs agendas, l'agenda de quelqu'un d'autre en lecture seule, agendas en ligne, copie publique du vôtre. Import et export de fichiers .ics (Outlook, Google, iPhone). Aussi : lieu, heure de fin, toute la journée, plusieurs jours, rappels à n'importe quel délai ou heure, Rappeler plus tard."
