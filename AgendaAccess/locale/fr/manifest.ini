summary = "AgendaAccess"
description = "Un agenda fait pour NVDA : les rendez-vous de chaque jour, des répétitions de toutes sortes, des rappels annoncés par NVDA, une recherche, un journal, et un agenda partagé entre ordinateurs avec Dropbox ou OneDrive. NVDA+Ctrl+Maj+Entrée ouvre l'agenda. Inspiré d'Agenda d'Abel Passos, Ângelo Abrantes et Rui Fontes, et de Mon agenda de Louis-Rock Lampron."
changelog = "Les rappels peuvent aussi être envoyés sur un téléphone, avec l'application gratuite ntfy (Options avancées)."
