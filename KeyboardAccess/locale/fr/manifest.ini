summary = "KeyboardAccess"
description = "Outils du clavier : redonne la touche Applications aux claviers qui n'en ont pas, clique sur l'élément sélectionné, et change la langue du clavier parmi toutes celles de Windows, sans les ajouter dans ses paramètres. NVDA+Ctrl+Maj+K ouvre la fenêtre du clavier. Basé sur Remap Applications Key de Rui Fontes, Ângelo Abrantes et Héctor J. Benítez Corredera."
changelog = "Avec le Remote de NVDA, AltGr ou Ctrl droite seule envoie maintenant la touche Applications à l'autre ordinateur."
